name: build
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build
        id: build
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-configuration-cache 2>&1 | tee build.log
      - name: smoke test (boot a server with the mod)
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\n' > run/server.properties
          ( sleep 100; echo "summon aifriends:friend 0 -55 0"; sleep 15; echo "save-all"; sleep 5; echo "stop" ) | timeout 300 ./gradlew runServer --no-configuration-cache --console=plain > smoke.log 2>&1 || true
          grep -E "Done \(|Summoned|Exception|ERROR|aifriends" smoke.log | head -60 || true
      - name: api dump (for development)
        if: always()
        run: bash .github/apidump.sh || true
      - name: upload jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: AIFriends-jar
          path: build/libs/aifriends-*.jar
      - name: publish ci output branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log smoke.log /tmp/out/ 2>/dev/null || true
          cp -r apidump /tmp/out/ 2>/dev/null || true
          cp build/libs/aifriends-*.jar /tmp/out/ 2>/dev/null || true
          rm -f /tmp/out/*-sources.jar
          echo "${{ steps.build.outcome }} ${GITHUB_SHA}" > /tmp/out/STATUS
          cd /tmp/out
          git init -q -b ci-out
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "ci output for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-out
      - name: fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
